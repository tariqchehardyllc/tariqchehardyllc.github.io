<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Tariq Chehardy LLC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232997ff'/%3E%3Ctext x='32' y='43' font-family='-apple-system,system-ui,sans-serif' font-size='26' font-weight='600' fill='%23fff' text-anchor='middle'%3ETC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f7;--card:#fcfcfc;--ink:#131316;--muted:#8f8f96;--faint:#c9c9cf;--accent:#2997ff;--line:#ececf0;--ease:cubic-bezier(.2,.7,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
.box{opacity:0;transform:translateY(14px);animation:rise .8s var(--ease) .05s both}
.dot{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:30px;box-shadow:0 14px 34px -14px rgba(41,151,255,.55)}
h1{font-size:44px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--muted);font-size:19px;margin-bottom:36px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a{font-size:15.5px;text-decoration:none;padding:12px 26px;border-radius:980px;transition:transform .2s var(--ease),background-color .2s var(--ease)}
.primary{background:var(--ink);color:#fff;font-weight:500}
.primary:hover{background:#000}
.ghost{border:1px solid var(--faint);color:var(--ink)}
.ghost:hover{background:#fff}
a:active{transform:scale(.95)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fine{margin-top:46px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--faint)}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.box{animation:none;opacity:1;transform:none}a:active{transform:none}}
</style>
</head>
<body>
<div class="box">
  <div class="dot">TC</div>
  <h1>Page not found.</h1>
  <p>This page doesn't exist. It may have moved, or the link is wrong.</p>
  <div class="links">
    <a class="primary" href="./">Official site</a>
    <a class="ghost" href="poke.html">Poke →</a>
  </div>
  <p class="fine">© 2020–2026 tariq chehardy llc · dallas, tx</p>
</div>
</body>
</html>
